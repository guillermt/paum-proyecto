<main class="management-page">
	<header class="management-header">
		<div>
			<p class="eyebrow">Administración</p>
			<h1>Manipulación de materias</h1>
			<p>Actualiza o elimina las materias registradas.</p>
		</div>
	</header>

	<div class="search-bar">
		<span class="material-icons">search</span>
		<input type="text" placeholder="Buscar materia..." (keyup)="aplicarFiltro($event)">
	</div>

	<p class="feedback success" *ngIf="successMessage">{{ successMessage }}</p>
	<p class="feedback error" *ngIf="errorMessage">{{ errorMessage }}</p>

	<app-formulario-cambios
		*ngIf="mostrarFormulario && materiaSeleccionada"
		tipo="materia"
		[nombre]="materiaSeleccionada.nombre"
		[semestre]="materiaSeleccionada.semestre"
		(guardar)="actualizar($event)"
		(cancelar)="cancelar()">
	</app-formulario-cambios>

	<div class="table-card" *ngIf="!cargando && dataSource.data.length">
		<table mat-table [dataSource]="dataSource" class="management-table">
			<ng-container matColumnDef="nombre">
				<th mat-header-cell *matHeaderCellDef>Nombre</th>
				<td mat-cell *matCellDef="let materia">{{ materia.nombre }}</td>
			</ng-container>
			<ng-container matColumnDef="semestre">
				<th mat-header-cell *matHeaderCellDef>Semestre</th>
				<td mat-cell *matCellDef="let materia">{{ materia.semestre }}</td>
			</ng-container>
			<ng-container matColumnDef="acciones">
				<th mat-header-cell *matHeaderCellDef>Acciones</th>
				<td mat-cell *matCellDef="let materia" class="actions-cell">
					<button type="button" class="action edit" (click)="iniciarActualizar(materia)" title="Actualizar materia" aria-label="Actualizar materia"><span class="material-icons">edit</span></button>
					<button type="button" class="action delete" (click)="iniciarEliminar(materia)" title="Eliminar materia" aria-label="Eliminar materia"><span class="material-icons">delete</span></button>
				</td>
			</ng-container>
			<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
			<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
		</table>
		<mat-paginator [pageSize]="5" [pageSizeOptions]="[5]" showFirstLastButtons aria-label="Seleccionar página"></mat-paginator>
	</div>
	<p class="empty-state" *ngIf="!cargando && !dataSource.data.length">No hay materias registradas.</p>

	<app-actualizar-modal [visible]="mostrarActualizar" [registro]="materiaSeleccionada?.nombre || ''" (confirmar)="confirmarActualizar()" (cancelar)="cancelar()"></app-actualizar-modal>
	<app-eliminar-modal [visible]="mostrarEliminar" [registro]="materiaSeleccionada?.nombre || ''" (confirmar)="confirmarEliminar()" (cancelar)="cancelar()"></app-eliminar-modal>
</main>
